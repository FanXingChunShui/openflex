# nfpm configuration for the OpenFlex desktop GUI (.rpm).
#
# Built by packaging/gui/build-gui-packages.sh and by the `gui-*` CI jobs.
name: openflex-gui
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: graphics
priority: optional
maintainer: OpenFlex contributors <openflex@users.noreply.github.com>
description: |
  Desktop GUI for OpenFlex discrete-event simulation models.
  .
  Native eframe/egui window: open and edit .ofm models, tune parameters with
  per-kind forms, run and step simulations with live state colouring, edit
  process flows on a node canvas and read reports, charts and experiments.
vendor: OpenFlex contributors
homepage: https://github.com/openflex/openflex
license: MIT OR Apache-2.0
depends:
  - libxkbcommon
  - libX11
  - libXcursor
  - libXrandr
  - libXi
  - mesa-libGL
contents:
  - src: ${BINARY}
    dst: /usr/bin/openflex-gui
    file_info:
      mode: 0755
  - src: ${README}
    dst: /usr/share/doc/openflex-gui/README.md
