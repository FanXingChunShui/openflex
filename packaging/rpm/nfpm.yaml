# nfpm configuration for the RPM package.
#
# Used by packaging/rpm/build-rpm.sh and by the optional `deb-rpm` CI job.
# nfpm reads environment variables, so the caller provides:
#   VERSION  package version, e.g. 0.1.0 (no leading "v")
#   ARCH     amd64 or arm64 (nfpm maps them to x86_64/aarch64 for RPM)
#   BINARY   path to the compiled openflex binary
#   README   path to the repository README.md
#
# Build:
#   VERSION=0.1.0 ARCH=amd64 BINARY=target/release/openflex README=README.md \
#     nfpm package --config packaging/rpm/nfpm.yaml --packager rpm \
#                  --target dist/openflex-0.1.0-1.x86_64.rpm
name: openflex
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: OpenFlex contributors <openflex@users.noreply.github.com>
description: |
  Clean-room, cross-platform discrete-event simulation engine and CLI.

  OpenFlex validates, runs and experiments with discrete-event simulation
  models written as JSON. It ships a library of 15 object kinds (source,
  queue, processor, sink, conveyor, combiner, separator, transporter, ...),
  12 statistical distributions, object triggers, routing rules, breakdowns
  and an experimenter, plus JSON/CSV/Markdown reports.
vendor: OpenFlex contributors
homepage: https://github.com/openflex/openflex
license: MIT OR Apache-2.0
contents:
  - src: ${BINARY}
    dst: /usr/bin/openflex
    file_info:
      mode: 0755
  - src: ${README}
    dst: /usr/share/doc/openflex/README.md
    file_info:
      mode: 0644
rpm:
  compression: xz
  group: Applications/Engineering
  summary: OpenFlex discrete-event simulation engine and CLI
  packager: OpenFlex contributors <openflex@users.noreply.github.com>
