name: container

# Build the multi-stage Dockerfile in packaging/Dockerfile and push it to the
# GitHub Container Registry as ghcr.io/fanxingchunshui/openflex.
#
# Only tags trigger this workflow: container images are versioned together with
# the release, never from an arbitrary branch tip. Manual runs (workflow_dispatch)
# are allowed for testing, and they still need a tag-like input.
#
# Secrets: none beyond the automatic GITHUB_TOKEN. `packages: write` is what
# lets the workflow push to GHCR.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR paths must be lowercase. Forks: replace this with your own owner.
  IMAGE: ghcr.io/fanxingchunshui/openflex
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-22.04
    # A multi-arch build is slow under QEMU; without a timeout a stuck build
    # holds the run for the default 6 hours and looks "pending" from outside.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "::error::container images are built from a v<version> tag, got '${tag}'"
              exit 1
              ;;
          esac
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::warning::tag '${tag}' does not match the workspace version '${cargo_version}'"
          fi
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          # `latest` must not move backwards to a pre-release.
          tags="${IMAGE}:${version}"$'\n'"${IMAGE}:${tag}"
          if [ "$prerelease" = "false" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags<<TAGS"
            echo "${tags}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${tag} (version ${version}, prerelease=${prerelease})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the native architecture first and run the binary: this catches a
      # broken Dockerfile before anything is pushed to the registry.
      - name: Build and smoke-test (linux/amd64)
        run: |
          set -euo pipefail
          docker build -f packaging/Dockerfile -t "${IMAGE}:smoke" .
          docker run --rm "${IMAGE}:smoke" --version | tee /tmp/version.txt
          grep -q "openflex ${{ steps.version.outputs.version }}" /tmp/version.txt

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance attestations add "unknown/unknown" manifest entries that
          # confuse tag checks and add registry round-trips; the release image
          # does not need them. Signing would be a separate, explicit step.
          provenance: false
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=OpenFlex
            org.opencontainers.image.description=Clean-room discrete-event simulation engine and CLI
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image (docker pull + run)
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${{ steps.version.outputs.version }}"
          docker run --rm "${IMAGE}:${{ steps.version.outputs.version }}" --version | tee /tmp/pulled-version.txt
          grep -q "openflex ${{ steps.version.outputs.version }}" /tmp/pulled-version.txt
          # The container must be able to run a model mounted from the host.
          docker run --rm -v "$PWD/examples:/models:ro" "${IMAGE}:${{ steps.version.outputs.version }}" \
            run /models/golden/mm1.ofm --format json > /tmp/report.json
          grep -q '"objects"' /tmp/report.json

      # Independent check of what the registry actually serves (no Docker):
      # tag exists, manifest is multi-arch, and `latest` points at this version.
      # Older tags do not contain this script, so it is optional there.
      - name: Verify the registry tags via the GHCR API
        run: |
          set -euo pipefail
          if [ -f scripts/verify-ghcr.sh ]; then
            bash scripts/verify-ghcr.sh \
              --tags "${{ steps.version.outputs.version }},latest" \
              --expect-latest "${{ steps.version.outputs.version }}"
          else
            echo "::warning::scripts/verify-ghcr.sh is not present in this checkout; skipping the registry API check"
          fi

      - name: Diagnose a failed build (log-only)
        if: failure()
        run: |
          set +e
          echo "== docker info =="
          docker info 2>&1 | tail -20
          echo "== buildx =="
          docker buildx ls 2>&1
          echo "== disk =="
          df -h / /var/lib/docker 2>/dev/null
          echo "== registry tags (may not exist yet) =="
          curl -fsSL "https://ghcr.io/token?scope=repository:fanxingchunshui/openflex:pull&service=ghcr.io" \
            | head -c 120 2>/dev/null || true

      - name: Image summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "- \`${IMAGE}:${{ steps.version.outputs.version }}\`"
            echo "- \`${IMAGE}:${{ steps.version.outputs.tag }}\`"
            if [ "${{ steps.version.outputs.prerelease }}" = "false" ]; then
              echo "- \`${IMAGE}:latest\`"
            else
              echo "- (pre-release: \`latest\` is not updated)"
            fi
            echo ""
            echo '```'
            echo "docker run --rm -v \"\$PWD:/workspace\" ${IMAGE}:${{ steps.version.outputs.version }} run /workspace/model.ofm"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
