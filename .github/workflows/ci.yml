name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GitHub-hosted runners have ~14 GB free on /. A multi-crate workspace with
  # incremental artefacts (plus llvm-cov profiles) can fill that, which shows up
  # as "No space left on device" mid-build. Incremental compilation is useless
  # in CI anyway (a fresh checkout never reuses it), so disable it globally and
  # let Swatinem/rust-cache keep only the dependency artefacts.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --exclude openflex-gui

      # Run the binary before the test suite, so a startup failure reads as
      # "the binary cannot start on this OS" instead of as 111 broken tests.
      # This is how the Windows stack overflow surfaced, and only after a release.
      - name: Binary smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --locked -p openflex-cli
          .\target\debug\openflex.exe --version
          .\target\debug\openflex.exe distributions | Select-Object -First 2
          .\target\debug\openflex.exe validate examples\mm1.ofm

      - name: Tests
        run: cargo test --workspace --locked --exclude openflex-gui

      # End-to-end smoke of the headline features: unit tests can pass while a
      # feature is unreachable from the outside (a dead parameter, an action that
      # is accepted yet ignored, a hook that never fires).
      # The shipped examples are documentation that happens to be executable:
      # a regression there is user-visible even when every unit test passes.
      - name: Examples validate, run, and are deterministic
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p openflex-cli
          bash scripts/check-examples.sh

      - name: Feature smoke (CLI end to end)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p openflex-cli
          python3 scripts/feature-smoke.py

      # PowerShell cannot be parsed on Linux/macOS runners, so the Windows
      # runner is the one that proves install.ps1 / uninstall.ps1 / the two new
      # signing and verification scripts are syntactically valid.
      - name: PowerShell syntax check (all .ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $files = Get-ChildItem -Path 'scripts', 'packaging' -Filter '*.ps1' -Recurse
          foreach ($file in $files) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Host ("{0}:{1}: {2}" -f $file.Name, $parseError.Extent.StartLineNumber, $parseError.Message)
              }
              $failed = $true
            }
            else {
              Write-Host ("ok: {0}" -f $file.Name)
            }
          }
          if ($failed) { exit 1 }

  golden:
    name: golden acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p openflex-cli --locked

      - name: Validate every example model
        run: |
          for model in examples/*.ofm examples/golden/*.ofm examples/objects/*.ofm; do
            ./target/release/openflex validate "$model"
          done

      - name: Golden cases against analytic values
        run: bash scripts/acceptance.sh

  # ---------------------------------------------------------------------------
  # Dependency policy: no yanked crates, no non-permissive licences, no
  # unknown registries. Configuration lives in deny.toml at the repo root.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # Security advisories are informational: a new RustSec advisory should not
  # block an unrelated pull request, but the report must be visible and kept.
  # ---------------------------------------------------------------------------
  audit:
    name: cargo-audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: |
          set -uo pipefail
          mkdir -p audit
          cargo audit --json > audit/report.json 2> audit/stderr.log || true
          cargo audit > audit/report.txt 2>&1 || true
          cat audit/report.txt
          {
            echo "### cargo audit"
            echo ""
            echo '```'
            tail -n 40 audit/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qi '^error' audit/report.txt; then
            echo "::warning::cargo audit reported an issue; see the cargo-audit artifact"
          fi

      - name: Upload the audit report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit
          path: audit/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Coverage: records the lcov report and enforces a conservative line-coverage
  # floor of 60% over the non-GUI crates. `openflex-gui` is excluded for the same
  # reason the test/clippy jobs exclude it: almost all of its code is immediate
  # mode drawing, so counting it measures the wrong thing (including it dropped
  # the total to 59.85% while every other crate stayed high).
  # Without the GUI the baseline is ~74.6% lines; the floor leaves ~14 points of
  # room for new/under-tested modules.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (llvm-cov baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage (line floor 60%)
        run: |
          set -euo pipefail
          mkdir -p coverage
          df -h / | tail -1
          # openflex-gui is an immediate-mode UI crate: almost all of its code
          # is drawing calls that only run on a live window, so it is excluded
          # here just as the test/clippy jobs exclude it. Its pure logic is
          # covered by the GUI unit tests (93 of them).
          cargo llvm-cov --workspace --exclude openflex-gui --locked --lcov --output-path coverage/lcov.info | tee coverage/run.log
          cargo llvm-cov report --summary-only | tee coverage/summary.txt
          # Enforce the floor separately so the summary above is still written
          # even when the check fails.
          cargo llvm-cov report --fail-under-lines 60
          df -h / | tail -1
          {
            echo "### Coverage"
            echo ""
            echo "Line coverage floor: **60%**, measured over all crates except openflex-gui"
            echo "(its drawing code only runs on a live window; the GUI unit tests cover its pure logic)."
            echo "Baseline with that exclusion: ~74.6% lines (v0.10.0 baseline on a clean checkout:"
            echo "77.91% lines, 75.75% functions, 76.33% regions)."
            echo ""
            echo "Lowest-covered modules today: \`studio.rs\` (~4%), \`serve.rs\` (~22%),"
            echo "\`compare.rs\` (~32%), \`distribution.rs\` (~49%), \`model.rs\` (~57%)."
            echo ""
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Performance floor: a 10k-object model must stay fast. Budgets are
  # deliberately loose (validate 2.0 s, run 5.0 s) against the local v0.16.0
  # baseline (0.14 s / 0.40 s): shared CI runners are noisy, and this gate is
  # meant to catch an order-of-magnitude regression (an O(n^2) sneaking back
  # into validate or the event loop), not a 20% wobble. It blocks the PR; if a
  # runner-noise failure is ever observed, raise the budget here and note why
  # in docs/verification/performance.md instead of deleting the job.
  # ---------------------------------------------------------------------------
  bench:
    name: bench (10k objects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p openflex-cli

      - name: Run the 10k-object benchmark
        run: |
          set -euo pipefail
          bash scripts/bench-large-model.sh --objects 10000 \
            --json bench.json --markdown bench-row.md
          cat bench-row.md

      - name: Enforce the performance floor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys

          LIMITS = {"validate": 2.0, "run": 5.0}
          with open("bench.json", encoding="utf-8") as handle:
              data = json.load(handle)
          failures = []
          lines = ["| phase | seconds | budget | status |", "|---|---|---|---|"]
          for phase, limit in LIMITS.items():
              seconds = data[phase]["seconds"]
              ok = seconds <= limit
              lines.append(
                  "| %s | %.2f | %.1f | %s |"
                  % (phase, seconds, limit, "ok" if ok else "**TOO SLOW**")
              )
              if not ok:
                  failures.append(phase)
          report = "\n".join(lines)
          print(report)
          with open("/tmp/bench-summary.md", "w", encoding="utf-8") as handle:
              handle.write("### Large-model benchmark (10k objects)\n\n" + report + "\n")
          if failures:
              print(
                  "::error::benchmark budget exceeded for: %s" % ", ".join(failures),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Append the benchmark table to the job summary
        if: always()
        run: |
          if [ -f /tmp/bench-summary.md ]; then cat /tmp/bench-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-10k
          path: |
            bench.json
            bench-row.md
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 180-second fuzz run. Needs a nightly toolchain and libFuzzer, so it is still
  # allowed to fail without blocking: the point is to surface crashes, not to
  # gate a PR on a stochastic process. 3 minutes per target is long enough to
  # get past the shallow parser cases the 60-second run used to cover.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz smoke (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz model JSON parsing (180s)
        run: |
          set -euo pipefail
          cargo +nightly fuzz run model_json -- -max_total_time=180 -rss_limit_mb=2048

      - name: Fuzz expression parsing (180s)
        run: |
          set -euo pipefail
          cargo +nightly fuzz run expr_parse -- -max_total_time=180 -rss_limit_mb=2048

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Native linux/arm64 test run. GitHub-hosted `ubuntu-24.04-arm` runners are
  # generally available for public repositories, so this job is now required
  # (it was optional while the image was in preview). If the runner image is
  # ever unavailable for a fork or an organisation quota reason, add
  # `continue-on-error: true` back and note it in docs/VERIFICATION.md.
  # ---------------------------------------------------------------------------
  test-arm64:
    name: test (linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked --exclude openflex-gui

  # ---------------------------------------------------------------------------
  # D3: the simulation core must stay wasm32-compatible so the browser/edge
  # story does not rot. openflex-core is the only crate that is *supported* on
  # wasm32: the CLI compiles there (std provides stubs) but cannot run, because
  # it needs a filesystem, argv, process exit codes and, with --parallel,
  # threads. See docs/verification/wasm.md.
  # ---------------------------------------------------------------------------
  wasm:
    name: wasm32 (openflex-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: cargo check -p openflex-core --target wasm32-unknown-unknown
        run: cargo check -p openflex-core --locked --target wasm32-unknown-unknown

      - name: cargo build -p openflex-core --release --target wasm32-unknown-unknown
        run: |
          set -euo pipefail
          cargo build -p openflex-core --release --locked --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/release/*.rlib
          {
            echo "### wasm32 build"
            echo ""
            echo "openflex-core checks and builds for \`wasm32-unknown-unknown\`."
            echo ""
            echo '```'
            ls -l target/wasm32-unknown-unknown/release/*.rlib
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the wasm boundary (CLI is not a wasm target)
        run: |
          set -euo pipefail
          # The CLI *compiles* for wasm32 (std stubs exist) but cannot run: it
          # reads model files from disk, parses argv, exits the process and can
          # spawn threads for --parallel. Do not claim wasm support for it.
          {
            echo ""
            echo "openflex-cli is **not** a supported wasm target: \`std::fs\` (model files),"
            echo "argv parsing, process exit codes and the \`--parallel\` thread pool all need a"
            echo "host OS. A browser build needs a wasm-bindgen wrapper (cdylib) around"
            echo "openflex-core; that is the remaining part of D3 in docs/BACKLOG.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the wasm rlib
        uses: actions/upload-artifact@v4
        with:
          name: openflex-core-wasm32
          path: target/wasm32-unknown-unknown/release/*.rlib
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The GUI crate is excluded from the workspace test jobs, so without this job
  # its tests never ran in CI: form, canvas and formatting regressions could
  # only be caught locally. These tests do not open a window, so no virtual
  # display is needed — only the system libraries the crate links against.
  # ---------------------------------------------------------------------------
  gui-tests:
    name: tests (openflex-gui, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GUI system libraries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5 &&
               sudo apt-get install -y --no-install-recommends \
                 libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
                 libgl1-mesa-dev libwayland-dev pkg-config; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Tests (openflex-gui)
        run: cargo test --locked -p openflex-gui

  # ---------------------------------------------------------------------------
  # Repository hygiene: every shell script parses, is shellcheck-clean at
  # warning level, and every YAML/TOML file the release pipeline consumes is
  # syntactically valid.
  # ---------------------------------------------------------------------------
  lint:
    name: scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n every shell script
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh packaging/*.sh packaging/*/*.sh)
          printf '%s\n' "${files[@]}"
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: shellcheck (warning level)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh packaging/*.sh packaging/*/*.sh)
          shellcheck -S warning "${files[@]}"

      - name: no matrix gap has already been closed
        run: python3 scripts/check-stale-gaps.py

      - name: docs state which version they describe
        run: bash scripts/check-doc-baselines.sh

      - name: parity evidence is behaviour, not just parsing
        run: python3 scripts/audit-parity-evidence.py --strict

      - name: parity matrix summary matches its tables
        run: python3 scripts/check-parity-counts.py

      - name: changelog keeps its shape
        run: bash scripts/check-changelog.sh

      - name: no new parameters the engine ignores
        run: bash scripts/check-dead-params.sh

      - name: parity ledger cites real test names
        run: bash scripts/check-doc-evidence.sh

      - name: YAML parses
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each { |f| YAML.parse_file(f); puts "yaml ok: #{f}" }' \
            .github/workflows/*.yml \
            .github/dependabot.yml \
            packaging/winget/*.yaml

      - name: TOML parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          for path in ("deny.toml", "Cargo.toml", "fuzz/Cargo.toml"):
              with open(path, "rb") as handle:
                  tomllib.load(handle)
              print("toml ok:", path)
          PY
