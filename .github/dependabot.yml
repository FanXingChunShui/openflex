version: 2

# Weekly dependency updates.
#
# Cargo PRs are grouped into one minor/patch PR per week to keep the noise low;
# major bumps arrive as individual PRs because they need a human decision.
# GitHub Actions and the Docker base image are updated the same way.

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    ignore:
      # rand 0.10 / rand_distr 0.6 are breaking API changes; upgrade them
      # deliberately together with the sampling code.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_distr"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: cargo
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/packaging"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
