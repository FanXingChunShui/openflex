[workspace]
resolver = "3"
members = ["crates/openflex-model", "crates/openflex-core", "crates/openflex-report", "crates/openflex-cli", "crates/openflex-gui"]

[workspace.package]
version = "0.51.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openflex/openflex"

[workspace.dependencies]
openflex-model = { path = "crates/openflex-model" }
openflex-core = { path = "crates/openflex-core" }
openflex-report = { path = "crates/openflex-report" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1", default-features = false, features = ["std", "sync"] }
serde_ignored = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
rayon = "1"
rust_xlsxwriter = "0.102"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rand = "0.8"
rand_distr = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
